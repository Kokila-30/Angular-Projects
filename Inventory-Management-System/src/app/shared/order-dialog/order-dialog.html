<div class="p-6">
  <h2 class="text-2xl font-bold mb-4 text-purple-700">📦 Purchase Order</h2>
  
  <form [formGroup]="orderForm" class="max-h-[80vh] overflow-y-auto pr-2">
    
    <!-- Admin Details -->
    <div class="mb-6 border-l-4 border-purple-500 pl-4">
      <h3 class="text-lg font-semibold mb-3">Order Details</h3>
      <div class="grid grid-cols-1 gap-4">
        <div>
          <label class="block text-sm font-medium mb-1">Supplier Name *</label>
          <input type="text" formControlName="supplierName" class="w-full border rounded-lg px-3 py-2" placeholder="Supplier name">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Notes (Optional)</label>
          <textarea formControlName="notes" rows="2" class="w-full border rounded-lg px-3 py-2" placeholder="Any special instructions..."></textarea>
        </div>
      </div>
    </div>

    <!-- Products to Order -->
    <div class="mb-6">
      <div class="flex justify-between items-center mb-3">
        <h3 class="text-lg font-semibold">Products to Order</h3>
        <button type="button" (click)="addItem()" class="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700 flex items-center gap-2">
          + Add Product
        </button>
      </div>

      <div class="overflow-x-auto">
        <table class="min-w-full border rounded-lg">
          <thead class="bg-purple-50">
            <tr>
              <th class="px-4 py-2 text-left">Product</th>
              <th class="px-4 py-2 text-left w-32">Quantity</th>
              <th class="px-4 py-2 text-left w-32">Price/Unit</th>
              <th class="px-4 py-2 text-left w-32">Total</th>
              <th class="px-4 py-2 text-center w-16">Action</th>
            </tr>
          </thead>
          <tbody formArrayName="items">
            <tr *ngFor="let item of items.controls; let i = index" [formGroupName]="i" class="border-t">
              <td class="px-4 py-2">
                <select formControlName="productId" (change)="onProductSelect(i)" class="w-full border rounded-lg px-2 py-1.5">
                  <option value="">Select Product</option>
                  <option *ngFor="let product of products" [value]="product.id">
                    {{product.name}}
                  </option>
                </select>
              </td>
              <td class="px-4 py-2">
                <input type="number" formControlName="quantity" (input)="updateItemTotal(i)" class="w-full border rounded-lg px-2 py-1.5" min="1" placeholder="Qty">
              </td>
              <td class="px-4 py-2">
                <input type="number" formControlName="price" (input)="updateItemTotal(i)" class="w-full border rounded-lg px-2 py-1.5" min="0" placeholder="Price">
              </td>
              <td class="px-4 py-2">
                <span class="font-semibold">{{getItemTotal(i) | currency}}</span>
              </td>
              <td class="px-4 py-2 text-center">
                <button type="button" (click)="removeItem(i)" class="text-red-600 hover:text-red-800">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                  </svg>
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div *ngIf="items.length === 0" class="text-center text-gray-500 py-6 border-2 border-dashed rounded-lg mt-3">
        No products added. Click "Add Product" to order.
      </div>
    </div>

    <!-- Order Summary -->
    <div class="mb-6 bg-purple-50 p-4 rounded-lg">
      <div class="flex justify-between items-center">
        <span class="font-semibold">Total Order Value:</span>
        <span class="text-2xl font-bold text-purple-700">{{getTotalAmount() | currency}}</span>
      </div>
      <p class="text-sm text-gray-500 mt-2">
        ℹ️ After supplier delivers, you can increase stock manually.
      </p>
    </div>

    <!-- Action Buttons -->
    <div class="flex justify-end gap-3 pt-4 border-t">
      <button type="button" (click)="onCancel()" class="px-4 py-2 bg-gray-300 rounded-lg hover:bg-gray-400">Cancel</button>
      <button type="button" (click)="onSubmit()" [disabled]="orderForm.invalid || items.length === 0" class="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700">
        Confirm Order
      </button>
    </div>
  </form>
</div>
